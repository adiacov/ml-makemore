[project]
name = "ml-makemore"
version = "0.1.0"
description = "Learning makemore by following Andrej Karpathy's Neural Networks: Zero to Hero lectures."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# CPU-only PyTorch (no working NVIDIA GPU on this machine).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
